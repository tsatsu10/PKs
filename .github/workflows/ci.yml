name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    # Placeholders only, no real secrets: config.toml's env(...) references must resolve to
    # *something* for the local stack to boot, even though these services stay disabled/unused
    # in CI (auth.sms.twilio, auth.external.apple, studio's optional AI key, experimental S3 storage).
    env:
      OPENAI_API_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      S3_HOST: ci-placeholder
      S3_REGION: ci-placeholder
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin to a known-good release instead of `latest` so CI doesn't silently pick up a
          # future breaking CLI version; bump deliberately when needed.
          version: 2.118.0
      # Exclude services pgTAP doesn't need. Migrations/tests/seed reference auth.* and
      # storage.* (auth.users, auth.uid/jwt/role, storage.buckets/objects/foldername), so
      # gotrue and storage-api must stay (they own those schemas' migrations). No migration,
      # seed or test file references a realtime.* or vault.* object, so realtime is safe to
      # drop; studio/imgproxy/edge-runtime/logflare/vector are dev-UI/observability/edge-function
      # extras pg_prove never touches. kong/postgrest/postgres-meta/supavisor/mailpit are left
      # running (not verified safe to exclude).
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime
      - run: supabase test db
      - name: Generate types from this branch's migrations
        run: supabase gen types typescript --local --schema public > database.types.ts
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: database.types.ts
      - name: Warn when committed types drift from the migrations
        run: |
          if ! diff -q database.types.ts frontend/src/data/database.types.ts > /dev/null; then
            echo "::warning title=Database types drift::frontend/src/data/database.types.ts differs from this branch's migrations. For a migration PR, commit the database-types artifact; otherwise run npm run gen:types."
            echo "⚠️ Committed database types differ from this branch's migrations. See the database-types artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    # Playwright against a real local stack (auth + REST), spec 2c / T4. The owner's machine has no
    # Docker, so this job is where the e2e tests run.
    # Pinned: Playwright 1.56 ships no Chromium for ubuntu-latest (26.04). Bump both together.
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ci-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-placeholder
      S3_HOST: ci-placeholder
      S3_REGION: ci-placeholder
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # The app needs auth (gotrue), REST (kong + postgrest) and storage; nothing here uses realtime.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime
      - name: Export the local stack's URL and keys
        run: |
          supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' > stack.env
          grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' stack.env | sed -E \
            -e 's/^API_URL=/VITE_SUPABASE_URL=/' \
            -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' >> "$GITHUB_ENV"
          rm stack.env
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build against the local stack
        run: npm run build
        working-directory: frontend
        env:
          # Cloudflare's always-pass test site key; config.toml holds the matching test secret.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/run-prompt/index.ts supabase/functions/webhook-deliver/index.ts
      # No --allow-net: network access is denied by default (`--allow-net=none` would allow a host named "none").
      - run: deno test --config supabase/functions/deno.json --allow-env supabase/functions
